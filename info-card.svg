<svg width="520" height="500" viewBox="0 0 520 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="520" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/><stop offset="0.58" stop-color="#0C2236"/><stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="38" y1="0" x2="478" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#67E8F9" stroke-opacity=".035"/></pattern>
  </defs>
  <style>
    .mono { font-family:'DejaVu Sans Mono',Consolas,monospace; }
    .title { fill:#F8FAFC; font:700 27px 'DejaVu Sans Mono',Consolas,monospace; }
    .handle { fill:#67E8F9; font:13px 'DejaVu Sans Mono',Consolas,monospace; }
    .key { fill:#22D3EE; font:600 13px 'DejaVu Sans Mono',Consolas,monospace; }
    .value { fill:#D9F8FF; font:13px 'DejaVu Sans Mono',Consolas,monospace; }
    .line { opacity:0; transform:translateX(-12px); animation:print .46s ease-out forwards; }
    .cursor { animation:blink .82s steps(1) infinite; }
    @keyframes print { to { opacity:1; transform:translateX(0); } }
    @keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
  </style>
  <rect x="1" y="1" width="518" height="498" rx="16" fill="url(#panel)" stroke="#0E7490" stroke-width="2"/>
  <rect x="1" y="1" width="518" height="31" rx="16" fill="#0F172A"/><rect x="1" y="32" width="518" height="467" fill="url(#grid)"/>
  <path d="M1 31H519" stroke="#164E63"/>
  <circle cx="18" cy="16" r="4" fill="#FB7185"/><circle cx="32" cy="16" r="4" fill="#FBBF24"/><circle cx="46" cy="16" r="4" fill="#22D3EE"/>
  <text x="260" y="20" text-anchor="middle" class="handle">yazan0arar@github:~</text>

  <g transform="translate(38 57)">
    <rect width="72" height="72" rx="15" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".72"/>
    <text x="36" y="46" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="23" font-weight="700">YA</text>
  </g>
  <text x="132" y="84" class="title">Yazan Arar</text>
  <text x="132" y="109" class="handle">yazan0arar</text>
  <rect x="38" y="143" width="440" height="2" rx="1" fill="url(#accent)"/>
  <rect x="38" y="141" width="56" height="6" rx="3" fill="#67E8F9" opacity="0.16">
    <animate attributeName="x" values="38;422;38" dur="5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.35;0.05" dur="5.4s" repeatCount="indefinite"/>
  </rect>

  <g class="line" style="animation-delay:0.60s"><text x="40" y="184" class="key">role</text><text x="151" y="184" class="value">Front-End Web Developer</text></g><g class="line" style="animation-delay:0.76s"><text x="40" y="218" class="key">focus</text><text x="151" y="218" class="value">Modern responsive web UI</text></g><g class="line" style="animation-delay:0.92s"><text x="40" y="252" class="key">stack</text><text x="151" y="252" class="value">React · TypeScript · Tailwind</text></g><g class="line" style="animation-delay:1.08s"><text x="40" y="286" class="key">also</text><text x="151" y="286" class="value">ASP.NET Core · MySQL · Python</text></g><g class="line" style="animation-delay:1.24s"><text x="40" y="320" class="key">project</text><text x="151" y="320" class="value">Doctor Plant — AI web platform</text></g><g class="line" style="animation-delay:1.40s"><text x="40" y="354" class="key">education</text><text x="151" y="354" class="value">B.Sc. Computer Science</text></g><g class="line" style="animation-delay:1.56s"><text x="40" y="388" class="key">location</text><text x="151" y="388" class="value">Palestine</text></g><g class="line" style="animation-delay:1.72s"><text x="40" y="422" class="key">status</text><text x="151" y="422" class="value">Open to web opportunities</text></g>

  <g transform="translate(38 467)">
    <text class="handle">$ build --for-the-web</text>
    <rect class="cursor" x="177" y="-11" width="8" height="14" rx="1" fill="#22D3EE"/>
  </g>
  <circle cx="110" cy="93" r="39" fill="none" stroke="#22D3EE" opacity="0.12">
    <animate attributeName="r" values="38;45;38" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.20;0;0.20" dur="3.2s" repeatCount="indefinite"/>
  </circle>
